<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- Professional Clean Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <!-- Brand -->
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-shield-halved text-base"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 tracking-tight">RBAC Simulator</h1>
                    <p class="text-[11px] text-slate-500 font-medium">Role-Based Access Control</p>
                </div>
            </div>

            <!-- Role Switcher Control -->
            <div class="flex items-center space-x-1.5 bg-slate-100 p-1 rounded-lg border border-slate-200">
                <span class="text-xs text-slate-500 px-2 font-medium hidden sm:inline">Role:</span>
                <button onclick="switchRole('Admin')" id="btn-role-Admin" 
                    class="px-3 py-1.5 rounded-md text-xs font-semibold transition flex items-center space-x-1.5 {% if current_user and current_user.role.value == 'Admin' %}bg-red-600 text-white shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-white{% endif %}">
                    <i class="fa-solid fa-user-shield text-[11px]"></i>
                    <span>Admin</span>
                </button>
                <button onclick="switchRole('Teacher')" id="btn-role-Teacher" 
                    class="px-3 py-1.5 rounded-md text-xs font-semibold transition flex items-center space-x-1.5 {% if current_user and current_user.role.value == 'Teacher' %}bg-amber-600 text-white shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-white{% endif %}">
                    <i class="fa-solid fa-chalkboard-user text-[11px]"></i>
                    <span>Teacher</span>
                </button>
                <button onclick="switchRole('Student')" id="btn-role-Student" 
                    class="px-3 py-1.5 rounded-md text-xs font-semibold transition flex items-center space-x-1.5 {% if current_user and current_user.role.value == 'Student' %}bg-emerald-600 text-white shadow-xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-white{% endif %}">
                    <i class="fa-solid fa-user-graduate text-[11px]"></i>
                    <span>Student</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Global Floating Alerts / Toasts Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Main Container -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 space-y-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Role-Based Access Control (RBAC) Simulator &bull; Academic Records Management
    </footer>

    <!-- Client Script -->
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
